<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>After School Classes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
  <div id="app" class="container py-4">
    <h1 class="mb-4">{{ sitename }}</h1>

    <div class="row">
      <div class="col-md-4 mb-3" v-for="lesson in lessons" :key="lesson.id">
        <div class="card h-100">
          <div class="card-body">
            <i :class="lesson.icon" class="fa-2x mb-2"></i>
            <h5 class="card-title">{{ lesson.subject }}</h5>
            <p class="card-text mb-1">Location: {{ lesson.location }}</p>
            <p class="card-text mb-1">Price: £{{ lesson.price }}</p>
            <p class="card-text">Spaces: {{ lesson.spaces }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
